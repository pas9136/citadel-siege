name: Verify isolated RC1 preview
on:
  push:
    branches: [preview/5.0-rc.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify exact RC1 source
        run: git diff --exit-code bc5d6d3232a854868cca6a8cc756d155cbd001ca -- index.html package.json package-lock.json
      - run: npm test
      - run: npm run test:render
      - run: npm run test:adaptive
      - run: node scripts/build-preview.mjs
      - name: Test final deployment and save isolation in both engines
        run: node tests/preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages-site
          path: _site
