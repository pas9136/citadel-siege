name: Original World checks
on:
  push:
    branches: [development-v8.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 scripts/build-v8-1.py && git diff --exit-code -- preview-8-1/index.html
      - run: python3 -m http.server 8000 &
      - run: node tests/v8-1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: original-world-tests
          path: |
            preview-8-1/test-results.json
            preview-8-1/gameplay-*.png
