name: Game quality checks
on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game
        run: node tests/smoke.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser gameplay regressions
        run: node tests/gameplay.mjs
      - name: Renderer cache and device scale regressions
        run: npm run test:render
      - name: Adaptive graphics regressions
        run: npm run test:adaptive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-previews
          path: test-results/
