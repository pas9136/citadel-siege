<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>8.1 geometry comparison</title><style>body{background:#101c24;color:#e8dfcd;font:16px system-ui;margin:24px}main{display:flex;gap:24px}figure{margin:0;width:30%}canvas,img{width:100%;image-rendering:pixelated}iframe{position:absolute;left:-2000px;width:844px;height:390px}figcaption{margin:12px 0}a{color:#9bdfc2}</style><h1>Original World · development comparison</h1><p>Cell-center walkability. Red indicates a difference; pale green indicates matching walkable cells. This does not validate dynamic object footprints.</p><p id="result">Comparing runtime collision against an independently extracted WPM raster…</p><main><figure><figcaption>A · Extracted original WPM</figcaption><img id="source" src="reference-geometry.png"></figure><figure><figcaption>B · Reconstructed collision</figcaption><canvas id="actual" width="384" height="896"></canvas></figure><figure><figcaption>C · Difference overlay</figcaption><canvas id="diff" width="384" height="896"></canvas></figure></main><iframe id="game" src="./"></iframe><script>
const ready=()=>{const t=document.getElementById('game').contentWindow.__citadelTest,img=document.getElementById('source');if(!t||!img.complete||!img.naturalWidth)return setTimeout(ready,100);const a=document.getElementById('actual').getContext('2d'),d=document.getElementById('diff').getContext('2d'),ref=document.createElement('canvas');ref.width=384;ref.height=896;const r=ref.getContext('2d');r.drawImage(img,0,0);const original=r.getImageData(0,0,384,896),actual=a.createImageData(384,896),diff=d.createImageData(384,896);let mismatch=0;for(let i=0;i<384*896;i++){const p=t.cellPoint(i),walk=t.terrainWalkable(p.x,p.y),expected=original.data[i*4]===94,bad=walk!==expected;mismatch+=bad;actual.data.set(walk?[94,112,112,255]:[21,32,38,255],i*4);diff.data.set(bad?[255,65,80,255]:walk?[129,177,151,255]:[21,32,38,255],i*4)}a.putImageData(actual,0,0);d.putImageData(diff,0,0);document.getElementById('result').textContent=`${mismatch} / 344064 cells differ · 12288 × 28672 source units · uniform scale 0.25 · north-up Y inversion`;window.comparison={mismatch}};ready();
</script></html>
